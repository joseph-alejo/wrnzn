<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Joseph Alejo developer signal deck</title>
  <desc id="desc">An animated profile console showing Joseph's location, technical focus, learning direction, and availability.</desc>
  <style>
    :root{--bg:#f8fafc;--panel:#ffffff;--panel2:#ecfeff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--teal:#0f766e;--cyan:#0369a1;--amber:#b45309;--code:#0f172a}
    @media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0b1724;--panel2:#0c2026;--text:#f8fafc;--muted:#94a3b8;--line:#253547;--teal:#2dd4bf;--cyan:#38bdf8;--amber:#f59e0b;--code:#dbeafe}}
    text{font-family:"Bahnschrift","Trebuchet MS",sans-serif}.mono{font-family:"Cascadia Code","Consolas",monospace}.label{font-size:13px;font-weight:700;letter-spacing:2px}.title{font-size:28px;font-weight:700;letter-spacing:.4px}.key{font-size:13px;font-weight:700;letter-spacing:1.5px}.value{font-size:18px;font-weight:650}.body{font-size:17px}.muted{fill:var(--muted)}.main{fill:var(--text)}.code{fill:var(--code)}
    @keyframes ring{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes blink{0%,42%,46%,100%{opacity:1}44%{opacity:.25}}
    .ring{animation:ring 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.live{animation:blink 3.6s linear infinite}
  </style>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="var(--teal)"/><stop offset=".55" stop-color="var(--cyan)"/><stop offset="1" stop-color="var(--amber)"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-opacity=".22"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#back)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)" opacity=".55"/>
  <rect x="24" y="24" width="1152" height="382" rx="22" fill="none" stroke="var(--line)"/>
  <path d="M24 90H1176" stroke="url(#beam)" stroke-width="3"/>

  <g transform="translate(52 48)">
    <circle cx="8" cy="0" r="12" fill="var(--teal)" opacity=".13" class="ring"/>
    <circle cx="8" cy="0" r="4" fill="var(--teal)" class="live"/>
    <text x="32" y="5" class="label" fill="var(--teal)">SIGNAL DECK / LIVE PROFILE</text>
    <text x="1060" y="5" text-anchor="end" class="mono label muted">WRNZN::ONLINE</text>
  </g>

  <g transform="translate(52 118)">
    <rect width="452" height="252" rx="18" fill="var(--panel)" stroke="var(--line)"/>
    <path d="M0 18Q0 0 18 0H452V48H0Z" fill="var(--teal)" opacity=".09"/>
    <circle cx="25" cy="24" r="5" fill="var(--amber)"/><circle cx="43" cy="24" r="5" fill="var(--cyan)"/><circle cx="61" cy="24" r="5" fill="var(--teal)"/>
    <text x="88" y="31" class="mono label muted">developer.signal</text>

    <g transform="translate(28 79)">
      <text class="mono key" fill="var(--teal)">LOCATION</text><text x="132" class="mono value code">PHILIPPINES</text>
      <text y="42" class="mono key" fill="var(--cyan)">PRIMARY</text><text x="132" y="42" class="mono value code">BACKEND + APPLIED AI</text>
      <text y="84" class="mono key" fill="var(--amber)">SYSTEMS</text><text x="132" y="84" class="mono value code">INTERNAL TOOLS + APIs</text>
      <text y="126" class="mono key" fill="var(--teal)">QUALITY</text><text x="132" y="126" class="mono value code">TESTS + DOCUMENTATION</text>
    </g>
    <rect x="28" y="225" width="320" height="3" rx="2" fill="url(#beam)"/>
    <rect x="356" y="225" width="12" height="3" rx="2" fill="var(--line)"/><rect x="376" y="225" width="28" height="3" rx="2" fill="var(--line)"/>
  </g>

  <g transform="translate(540 118)">
    <text x="0" y="24" class="title main">Current trajectory</text>
    <text x="548" y="22" text-anchor="end" class="mono label muted">NEXT / ITERATE</text>
    <path d="M22 61V218" stroke="var(--line)" stroke-width="2"/>

    <g transform="translate(0 60)">
      <circle cx="22" cy="18" r="18" fill="var(--teal)" opacity=".15"/><circle cx="22" cy="18" r="6" fill="var(--teal)"/>
      <text x="58" y="8" class="label" fill="var(--teal)">01 / DEEPEN</text>
      <text x="58" y="34" class="body main">Python, JavaScript, API integration, databases,</text><text x="58" y="58" class="body main">and automated testing.</text>
    </g>
    <g transform="translate(0 139)">
      <circle cx="22" cy="18" r="18" fill="var(--cyan)" opacity=".15"/><circle cx="22" cy="18" r="6" fill="var(--cyan)"/>
      <text x="58" y="8" class="label" fill="var(--cyan)">02 / EXPLORE</text>
      <text x="58" y="34" class="body main">Reliable backend systems, applied AI,</text><text x="58" y="58" class="body main">and practical software quality.</text>
    </g>
    <g transform="translate(0 218)">
      <circle cx="22" cy="18" r="18" fill="var(--amber)" opacity=".15"/><circle cx="22" cy="18" r="6" fill="var(--amber)"/>
      <text x="58" y="8" class="label" fill="var(--amber)">03 / CONNECT</text>
      <text x="58" y="34" class="body main">Part-time · freelance · internship · junior roles</text>
    </g>
  </g>

  <path id="route" d="M504 336C528 336 522 156 548 156" fill="none" stroke="var(--cyan)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 8"/>
  <circle r="7" fill="var(--amber)" filter="url(#glow)" opacity=".9"><animateMotion dur="4s" repeatCount="indefinite" path="M504 336C528 336 522 156 548 156"/></circle>
</svg>
