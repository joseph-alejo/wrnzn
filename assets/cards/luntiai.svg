<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">LuntiAI</title><desc id="desc">Barangay-level crop recommendations using local soil, weather, and crop data.</desc>
  <style>:root{--bg:#f8fafc;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--a:#15803d;--b:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#081811;--text:#f8fafc;--muted:#a7b8aa;--line:#294235;--a:#4ade80;--b:#2dd4bf}}text{font-family:"Bahnschrift","Trebuchet MS",sans-serif}.mono{font-family:"Cascadia Code","Consolas",monospace}@keyframes grow{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.leaf{animation:grow 3.2s ease-in-out infinite;transform-origin:1070px 158px}</style>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--line)" stroke-opacity=".16"/></pattern></defs>
  <rect width="1200" height="230" rx="24" fill="var(--bg)"/><rect width="1200" height="230" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="var(--line)"/><rect width="10" height="230" rx="5" fill="url(#edge)"/>
  <text x="42" y="42" class="mono" font-size="14" font-weight="700" letter-spacing="2" fill="var(--a)">FIELD MODEL / 02</text><text x="1158" y="42" text-anchor="end" class="mono" font-size="14" font-weight="700" letter-spacing="1.5" fill="var(--b)">OPEN REPOSITORY ↗</text>
  <text x="42" y="93" font-size="38" font-weight="750" fill="var(--text)">LuntiAI</text><text x="42" y="127" font-size="19" fill="var(--muted)">Crop recommendations grounded in barangay-level soil,</text><text x="42" y="153" font-size="19" fill="var(--muted)">weather, and crop observations.</text>
  <g transform="translate(42 178)" font-size="15" font-weight="650"><rect width="82" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="41" y="19" text-anchor="middle" fill="var(--a)">Python</text><rect x="92" width="86" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="135" y="19" text-anchor="middle" fill="var(--b)">FastAPI</text><rect x="188" width="112" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="244" y="19" text-anchor="middle" fill="var(--a)">scikit-learn</text><rect x="310" width="72" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="346" y="19" text-anchor="middle" fill="var(--b)">SQLite</text></g>
  <g transform="translate(1000 70)" fill="none" stroke="var(--a)" stroke-width="4" stroke-linecap="round"><g class="leaf"><path d="M70 105V48"/><path d="M70 72C42 70 28 49 31 20c28-2 49 12 52 39" fill="var(--a)" fill-opacity=".12"/><path d="M72 60c20-25 43-29 68-17 0 28-19 48-53 48" fill="var(--b)" fill-opacity=".12"/><path d="M36 127h100" stroke="var(--line)"/><circle cx="70" cy="105" r="9" fill="var(--b)" stroke="none"/></g></g>
</svg>
