<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">AparTrack</title><desc id="desc">A team-built rental operations system with tenant, billing, deposit, audit, and role-based workflows.</desc>
  <style>:root{--bg:#f8fafc;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--a:#0f766e;--b:#b45309}@media(prefers-color-scheme:dark){:root{--bg:#08141f;--text:#f8fafc;--muted:#94a3b8;--line:#263747;--a:#2dd4bf;--b:#f59e0b}}text{font-family:"Bahnschrift","Trebuchet MS",sans-serif}.mono{font-family:"Cascadia Code","Consolas",monospace}@keyframes active{0%,100%{opacity:.3}50%{opacity:1}}@keyframes load{0%,100%{transform:scaleX(.42)}50%{transform:scaleX(1)}}.active{animation:active 2.4s ease-in-out infinite}.load{animation:load 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left}</style>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--line)" stroke-opacity=".16"/></pattern></defs>
  <rect width="1200" height="230" rx="24" fill="var(--bg)"/><rect width="1200" height="230" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="var(--line)"/><rect x="0" y="0" width="10" height="230" rx="5" fill="url(#edge)"/>
  <text x="42" y="42" class="mono" font-size="14" font-weight="700" letter-spacing="2" fill="var(--a)">OPS SYSTEM / 01</text><text x="1158" y="42" text-anchor="end" class="mono" font-size="14" font-weight="700" letter-spacing="1.5" fill="var(--b)">TEAM BUILD</text>
  <text x="42" y="93" font-size="38" font-weight="750" fill="var(--text)">AparTrack</text><text x="42" y="127" font-size="19" fill="var(--muted)">Rental operations across tenants, billing, deposits, audits,</text><text x="42" y="153" font-size="19" fill="var(--muted)">and role-based workflows.</text>
  <g transform="translate(42 178)" font-size="15" font-weight="650"><rect width="88" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="44" y="19" text-anchor="middle" fill="var(--a)">Node.js</text><rect x="98" width="86" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="141" y="19" text-anchor="middle" fill="var(--a)">Express</text><rect x="194" width="94" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="241" y="19" text-anchor="middle" fill="var(--b)">MongoDB</text><rect x="298" width="60" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="328" y="19" text-anchor="middle" fill="var(--b)">JWT</text><rect x="368" width="130" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="433" y="19" text-anchor="middle" fill="var(--a)">Jest + Playwright</text></g>
  <g transform="translate(966 68)">
    <rect width="192" height="126" rx="14" fill="var(--bg)" stroke="var(--line)"/>
    <path d="M0 30h192" stroke="var(--line)"/><circle cx="16" cy="15" r="4" fill="var(--b)"/><circle cx="30" cy="15" r="4" fill="var(--a)" opacity=".45"/><text x="46" y="20" class="mono" font-size="10" letter-spacing="1.5" fill="var(--muted)">OPS CONSOLE</text>
    <rect x="14" y="44" width="164" height="24" rx="7" fill="var(--a)" opacity=".08"/><circle cx="28" cy="56" r="5" fill="var(--a)" class="active"/><text x="40" y="60" class="mono" font-size="10" fill="var(--text)">UNIT 04</text><text x="166" y="60" text-anchor="end" class="mono" font-size="9" font-weight="700" fill="var(--a)">PAID</text>
    <rect x="14" y="76" width="164" height="12" rx="6" fill="var(--line)" opacity=".35"/><rect x="14" y="76" width="118" height="12" rx="6" fill="var(--a)" opacity=".55" class="load"/>
    <text x="14" y="109" class="mono" font-size="9" fill="var(--muted)">AUDIT QUEUE</text><rect x="142" y="96" width="36" height="20" rx="10" fill="var(--b)" opacity=".16"/><text x="160" y="110" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="var(--b)">02</text>
  </g>
</svg>
