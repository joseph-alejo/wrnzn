<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Retail Robustness Studio</title><desc id="desc">A visual testing studio comparing model behavior under blur, noise, and occlusion.</desc>
  <style>:root{--bg:#f8fafc;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--a:#0369a1;--b:#be123c}@media(prefers-color-scheme:dark){:root{--bg:#08131e;--text:#f8fafc;--muted:#9eb2c5;--line:#293949;--a:#38bdf8;--b:#fb7185}}text{font-family:"Bahnschrift","Trebuchet MS",sans-serif}.mono{font-family:"Cascadia Code","Consolas",monospace}@keyframes scan{0%,100%{transform:translateX(-24px);opacity:.2}50%{transform:translateX(24px);opacity:1}}.scan{animation:scan 3s ease-in-out infinite}</style>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--line)" stroke-opacity=".16"/></pattern></defs>
  <rect width="1200" height="230" rx="24" fill="var(--bg)"/><rect width="1200" height="230" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="var(--line)"/><rect width="10" height="230" rx="5" fill="url(#edge)"/>
  <text x="42" y="42" class="mono" font-size="14" font-weight="700" letter-spacing="2" fill="var(--a)">VISION LAB / 03</text><text x="1158" y="42" text-anchor="end" class="mono" font-size="14" font-weight="700" letter-spacing="1.5" fill="var(--b)">OPEN REPOSITORY ↗</text>
  <text x="42" y="93" font-size="38" font-weight="750" fill="var(--text)">Retail Robustness Studio</text><text x="42" y="127" font-size="19" fill="var(--muted)">Comparing vision-model behavior when images are blurred,</text><text x="42" y="153" font-size="19" fill="var(--muted)">noisy, or partially hidden.</text>
  <g transform="translate(42 178)" font-size="15" font-weight="650"><rect width="82" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="41" y="19" text-anchor="middle" fill="var(--a)">Python</text><rect x="92" width="78" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="131" y="19" text-anchor="middle" fill="var(--b)">Gradio</text><rect x="180" width="124" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="242" y="19" text-anchor="middle" fill="var(--a)">MobileNetV3</text><rect x="314" width="126" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="377" y="19" text-anchor="middle" fill="var(--b)">TinyMobileViT</text></g>
  <g transform="translate(980 78)" fill="none"><path d="M0 56C42 4 118 4 160 56-118 108-42 108 0 56Z" stroke="var(--a)" stroke-width="4"/><circle cx="80" cy="56" r="30" stroke="var(--b)" stroke-width="4"/><circle cx="80" cy="56" r="10" fill="var(--a)"/><path class="scan" d="M80 14V98" stroke="var(--b)" stroke-width="3" stroke-dasharray="5 6"/></g>
</svg>
