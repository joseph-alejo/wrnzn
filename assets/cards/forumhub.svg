<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">ForUMhub</title><desc id="desc">A campus community forum and marketplace designed around student interaction.</desc>
  <style>:root{--bg:#f8fafc;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--a:#b45309;--b:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#171008;--text:#f8fafc;--muted:#c5b5a2;--line:#493827;--a:#f59e0b;--b:#2dd4bf}}text{font-family:"Bahnschrift","Trebuchet MS",sans-serif}.mono{font-family:"Cascadia Code","Consolas",monospace}@keyframes type{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}@keyframes arrive{0%,100%{opacity:.45}50%{opacity:1}}.type{animation:type 1.6s ease-in-out infinite}.d2{animation-delay:.18s}.d3{animation-delay:.36s}.arrive{animation:arrive 2.8s ease-in-out infinite}</style>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--line)" stroke-opacity=".16"/></pattern></defs>
  <rect width="1200" height="230" rx="24" fill="var(--bg)"/><rect width="1200" height="230" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="var(--line)"/><rect width="10" height="230" rx="5" fill="url(#edge)"/>
  <text x="42" y="42" class="mono" font-size="14" font-weight="700" letter-spacing="2" fill="var(--a)">COMMUNITY / 04</text><text x="1158" y="42" text-anchor="end" class="mono" font-size="14" font-weight="700" letter-spacing="1.5" fill="var(--b)">OPEN REPOSITORY ↗</text>
  <text x="42" y="93" font-size="38" font-weight="750" fill="var(--text)">ForUMhub</text><text x="42" y="127" font-size="19" fill="var(--muted)">A campus forum and marketplace shaped around student</text><text x="42" y="153" font-size="19" fill="var(--muted)">conversations, discovery, and exchange.</text>
  <g transform="translate(42 178)" font-size="15" font-weight="650"><rect width="82" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="41" y="19" text-anchor="middle" fill="var(--a)">Flutter</text><rect x="92" width="58" height="28" rx="14" fill="var(--b)" opacity=".14"/><text x="121" y="19" text-anchor="middle" fill="var(--b)">Dart</text><rect x="160" width="94" height="28" rx="14" fill="var(--a)" opacity=".14"/><text x="207" y="19" text-anchor="middle" fill="var(--a)">Firebase</text></g>
  <g transform="translate(966 68)">
    <rect width="192" height="126" rx="14" fill="var(--bg)" stroke="var(--line)"/>
    <path d="M0 30h192" stroke="var(--line)"/><circle cx="16" cy="15" r="4" fill="var(--a)"/><circle cx="30" cy="15" r="4" fill="var(--b)" opacity=".5"/><text x="46" y="20" class="mono" font-size="10" letter-spacing="1.2" fill="var(--muted)">CAMPUS FEED</text>
    <circle cx="28" cy="51" r="10" fill="var(--a)" opacity=".7"/><rect x="46" y="43" width="82" height="7" rx="3.5" fill="var(--text)" opacity=".65"/><rect x="46" y="56" width="124" height="6" rx="3" fill="var(--line)" opacity=".55"/>
    <circle cx="28" cy="84" r="10" fill="var(--b)" opacity=".7"/><rect x="46" y="76" width="62" height="7" rx="3.5" fill="var(--text)" opacity=".55"/><rect x="46" y="89" width="98" height="6" rx="3" fill="var(--line)" opacity=".48"/>
    <rect x="14" y="105" width="96" height="15" rx="7.5" fill="var(--a)" opacity=".12"/><circle cx="34" cy="112.5" r="3" fill="var(--a)" class="type"/><circle cx="46" cy="112.5" r="3" fill="var(--b)" class="type d2"/><circle cx="58" cy="112.5" r="3" fill="var(--a)" class="type d3"/>
    <rect x="142" y="102" width="36" height="20" rx="10" fill="var(--b)" opacity=".15" class="arrive"/><text x="160" y="116" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="var(--bg)">+3</text>
  </g>
</svg>
