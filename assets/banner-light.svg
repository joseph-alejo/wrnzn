<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Joseph Alejo</title>
  <desc id="desc">Computer Science, applied AI, and internal tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.58" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="66" r="170" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="110" cy="284" r="130" fill="#f59e0b" opacity=".055" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M865 92H956L1008 144H1104" stroke="#0369a1" stroke-opacity=".4" stroke-width="2"/>
    <path d="M896 214H954L1008 160H1130" stroke="#0f766e" stroke-opacity=".52" stroke-width="2"/>
    <path d="M932 52V102L984 154V270" stroke="#b45309" stroke-opacity=".34" stroke-width="2"/>
    <circle cx="865" cy="92" r="6" fill="#0369a1" stroke="none"/>
    <circle cx="896" cy="214" r="6" fill="#0f766e" stroke="none"/>
    <circle cx="1104" cy="144" r="6" fill="#0369a1" stroke="none"/>
    <circle cx="1130" cy="160" r="6" fill="#0f766e" stroke="none"/>
    <circle cx="932" cy="52" r="6" fill="#b45309" stroke="none"/>
    <circle cx="984" cy="270" r="6" fill="#b45309" stroke="none"/>
    <circle cx="1008" cy="152" r="42" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1008" cy="152" r="27" stroke="#0f172a" stroke-opacity=".16" stroke-width="2"/>
    <path d="M994 151l10 10 20-24" stroke="#0f172a" stroke-width="4"/>
  </g>

  <rect x="66" y="63" width="184" height="30" rx="15" fill="#0f766e" fill-opacity=".08" stroke="#0f766e" stroke-opacity=".3"/>
  <circle cx="84" cy="78" r="5" fill="#0f766e"/>
  <text x="98" y="83" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">OPEN TO BUILD</text>

  <text x="66" y="160" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="750" letter-spacing="1">JOSEPH ALEJO</text>
  <rect x="68" y="181" width="520" height="4" rx="2" fill="url(#accent)"/>
  <text x="68" y="222" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing=".7">COMPUTER SCIENCE · APPLIED AI · INTERNAL TOOLS</text>
  <text x="68" y="263" fill="#64748b" font-family="Consolas, monospace" font-size="16">build carefully  /  test honestly  /  keep learning</text>
</svg>
