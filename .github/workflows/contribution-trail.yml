name: Generate contribution trail

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-trail.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark activity trails
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-trail.svg?color_snake=#B45309&color_dots=#ebedf0,#ccfbf1,#5eead4,#0f766e,#155e75
            dist/contribution-trail-dark.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#161b22,#134e4a,#0f766e,#22d3ee,#f59e0b

      - name: Publish trails to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
